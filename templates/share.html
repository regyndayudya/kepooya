<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Share Pertanyaan</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
   
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pathSegments = window.location.pathname.split('/');
            const kode = pathSegments[pathSegments.length - 1];
            history.pushState(null, null, location.href);
            window.onpopstate = function() {
                const confirmLogout = confirm("Apakah anda yakin ingin ke halaman sebelumnya? Sesi akses akan ditutup.");
                if (confirmLogout) {
                    fetch(/delete_session/${kode}, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    })
                    .then(() => { window.history.back(); })
                    .catch(error => { console.error('Error:', error); window.history.back(); });
                } else {
                    history.go(1); 
                }
            };
        });

        function executeCopy() {
            const text = document.getElementById('linkJawab').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("Link berhasil disalin! 📋");
            });
        }
    </script>
</head>
<body>

<div class="card">
  <h2>Yeayy.. Siap Dibagikan!</h2>
  <p>🔗 Link menjawab:</p>

  <div style="word-break: break-all; margin: 10px 0; font-size: 10px;">
      <a id="linkJawab" href="{{ link }}">{{ link }}</a>
  </div>
  
  <button class="btn-blue" id="copyBtn">Copy Link</button>

  <hr style="margin: 20px 0; width: 100%; border-top: 2px dashed #000;">

  <p>🔐 Akses Jawaban (Khusus Pembuat):</p>
  
  <button class="btn-pink" id="viewBtn" data-url="{{ url_for('lihat_jawaban', kode=kode, token=temp_token) }}">
      Lihat Jawaban Saya 👁️ (Sesi Ini Saja)
  </button>
 
  <button class="btn-gray" data-url="/home">Home</button>
</div>

<script>
    document.addEventListener('click', function (e) {
        const btn = e.target.closest('button');
        if (!btn) return;

        const sound = new Audio("{{ url_for('static', filename='click.wav') }}");
        sound.play().catch(err => console.log("Audio play error"));

        if (btn.id === 'copyBtn') {
            setTimeout(executeCopy, 100);
        }

        const targetUrl = btn.getAttribute('data-url');
        if (targetUrl) {
            e.preventDefault();
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 400); 
        }
    });
</script>

</body>
</html>
