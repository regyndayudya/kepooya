<body>

<div class="card">
  <h1>🌸 Welcome to KEPOYA! 🌸</h1>
  <p>Tempat bertanya anonym paling seru 💬💗</p>
  <button class="btn-pink" id="startBtn">Mulai Yuk 💖</button>
</div>


<audio id="clickSound">
    <source src="{{ url_for('static', filename='click.wav') }}" type="audio/wav">
</audio>

<script>
    document.addEventListener('click', function (e) {
        const btn = e.target.closest('button');
        
        if (btn) {
            // 1. Gunakan Audio Context (Opsional) atau Inisialisasi Audio Langsung
            const soundPath = "{{ url_for('static', filename='click.wav') }}";
            const sound = new Audio(soundPath);
            
            // 2. Paksa browser memuat audio
            sound.load(); 
            
            // 3. Putar suara
            const playPromise = sound.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    // Suara berhasil diputar
                    lanjutPindah(btn);
                }).catch(error => {
                    console.log("Suara diblokir, tetap pindah halaman...");
                    lanjutPindah(btn);
                });
            }
        }

        function lanjutPindah(button) {
            if (button.id === 'startBtn' || button.classList.contains('btn-pink')) {
                // Beri jeda 400ms agar telinga sempat mendengar suaranya
                setTimeout(function() {
                    window.location.assign("/home");
                }, 400);
            }
        }
    });
</script>

</body>
</html>
