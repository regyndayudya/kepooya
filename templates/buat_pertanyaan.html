
<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Buat Pertanyaan</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>

<div class="card">
  <h2>📝 Buat Pertanyaan</h2>
    
  <form method="POST" action="{{ url_for('buat_pertanyaan') }}" id="buatForm">
    <textarea name="tanyaInput" rows="5" placeholder="Tulis pertanyaan Anda di sini..." required></textarea>
    <button class="btn-pink" type="submit" id="submitBtn">Simpan Pertanyaan 💖</button>
  </form>
  <button class="btn-gray" data-url="/home">Home</button>    
</div>

<script>
    document.addEventListener('click', function (e) {
        const btn = e.target.closest('button');
        if (!btn) return;

        const sound = new Audio("{{ url_for('static', filename='click.wav') }}");

        if (btn.type === 'submit') {
            const form = btn.closest('form');
            if (form.checkValidity()) {
                e.preventDefault(); 
                sound.play().catch(err => console.log("Audio error"));
                setTimeout(function() { form.submit(); }, 400);
            }
        } else {
            const targetUrl = btn.getAttribute('data-url');
            if (targetUrl) {
                e.preventDefault();
                sound.play().catch(err => console.log("Audio error"));
                setTimeout(function() { window.location.href = targetUrl; }, 400);
            }
        }
    });
</script>
</body>
</html>
